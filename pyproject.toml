[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "do-personal-assistant"
version = "0.1.0"
description = "Do's cross-platform command-line Gemini assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-genai>=1.0",
  "python-dotenv>=1.0",
]

[project.scripts]
do = "do_cli:main"

[tool.setuptools]
py-modules = ["do_cli", "language_filter"]
